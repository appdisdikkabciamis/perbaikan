<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal TALAS Ciamis - Data Peningkatan Layanan</title>
    <!-- Tailwind CSS untuk Styling Cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Konfigurasi Tema Warna Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        text: {
                            primary: '#0f172a',
                            secondary: '#475569',
                            tertiary: '#94a3b8',
                            inverse: '#524980',
                        },
                        surface: {
                            base: '#000000',
                            muted: '#f8fafc',
                            neutral: '#f5f5f5',
                            raised: '#ffffff',
                        },
                        stroke: {
                            default: '#e5e7eb',
                            muted: '#e2e8f0',
                        },
                        brand: {
                            50: '#f4f2fb',
                            100: '#ebe7f7',
                            200: '#d8d2ef',
                            300: '#b9aee0',
                            400: '#9487cf',
                            500: '#786ebf',
                            600: '#524980',
                            700: '#473f70',
                            800: '#39335d',
                            900: '#2d2848',
                        },
                        accent: {
                            50: '#f4f2fb',
                            100: '#ebe7f7',
                            150: '#d2ccff',
                            200: '#d8d2ef',
                            300: '#b9aee0',
                            400: '#9487cf',
                            500: '#786ebf',
                            600: '#524980',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'Noto Sans', 'sans-serif', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'],
                        heading: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'Noto Sans', 'sans-serif', 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'],
                    },
                    borderRadius: {
                        xs: '12px',
                        sm: '16px',
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Efek Kursor Mengetik */
        #typewriter::after {
            content: '|';
            animation: blink 0.8s step-start infinite;
            font-weight: 300;
            color: #524980; /* Warna ungu sesuai tema */
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* Animasi Muncul Ikon (Jatuh dari Atas) */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .animate-fade-in {
            animation: fadeInDown 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Pola Latar Belakang Hero */
        .bg-pattern {
            position: relative;
            background-color: #f8fafc;
        }

        .bg-pattern::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(120, 110, 191, 0.22) 1px, transparent 1px),
                linear-gradient(90deg, rgba(120, 110, 191, 0.22) 1px, transparent 1px);
            background-size: 144px 144px;
            background-position: center center;
            -webkit-mask-image: radial-gradient(ellipse 75% 45% at center, black 20%, transparent 100%);
            mask-image: radial-gradient(ellipse 75% 45% at center, black 20%, transparent 100%);
            /* Transisi sangat halus untuk efek hover */
            transition: transform 1.5s ease-out;
        }

        /* Efek saat mouse diarahkan ke background */
        .bg-pattern:hover::before {
            transform: scale(1.05) translateY(10px);
        }
    </style>
</head>
<body class="font-sans text-base text-text-secondary antialiased bg-surface-muted selection:bg-brand-600 selection:text-surface-raised">

    <!-- Hero Section -->
    <section id="beranda" class="relative min-h-[100dvh] flex items-center justify-center p-4 overflow-hidden bg-pattern">
        <!-- Dekorasi Latar -->
        <div class="absolute top-0 right-0 -mr-20 -mt-20 w-96 h-96 rounded-full bg-brand-100 blur-3xl opacity-50 pointer-events-none"></div>
        <div class="absolute bottom-0 left-0 -ml-20 -mb-20 w-80 h-80 rounded-full bg-accent-500/10 blur-3xl opacity-50 pointer-events-none"></div>

        <div class="relative max-w-7xl mx-auto px-6 sm:px-20 lg:px-24 text-center -mt-16">
            <div id="icon-container" class="flex justify-center -mb-4 relative z-10 opacity-0">
                <img src="icon.png" alt="Icon" class="w-56 sm:w-72 h-auto object-contain">
            </div>
            <h1 id="typewriter" class="font-heading text-4xl sm:text-[42px] lg:text-[52px] font-extrabold text-text-primary tracking-tight leading-tight mb-10 relative z-20" style="min-height: 140px;">
            </h1>

            <div id="button-container" class="opacity-0 transition-opacity duration-1000 flex flex-col sm:flex-row gap-4 justify-center items-center">
                <a href="https://talas-disdik.ciamiskab.go.id/" class="w-auto px-6 sm:px-12 py-3 sm:py-4 text-base whitespace-nowrap bg-brand-600 text-surface-raised font-semibold rounded-xs shadow-lg hover:bg-brand-700 hover:shadow-lg hover:-translate-y-1 transition-all duration-300">
                    <i class="fa-solid fa-rocket mr-2"></i> Jelajahi Portal Layanan
                </a>
            </div>
        </div>
    </section>

    <!-- JavaScript untuk Animasi & Logika -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const text = "Portal layanan ini sedang\ndalam tahap perancangan ...";
            const typewriterElement = document.getElementById("typewriter");
            let i = 0;

            function typeWriter() {
                if (i < text.length) {
                    if (text.charAt(i) === '\n') {
                        typewriterElement.innerHTML += '<br>';
                    } else {
                        typewriterElement.innerHTML += text.charAt(i);
                    }
                    i++;
                    setTimeout(typeWriter, 100);
                } else {
                    // Animasi selesai, tampilkan tombol dan ikon
                    const btnContainer = document.getElementById('button-container');
                    if (btnContainer) {
                        btnContainer.classList.remove('opacity-0');
                    }
                    
                    const iconContainer = document.getElementById('icon-container');
                    if (iconContainer) {
                        // Memulai animasi jatuh dari atas
                        iconContainer.classList.add('animate-fade-in');
                        // Menghapus class opacity-0 bawaan agar animasi terlihat
                        iconContainer.classList.remove('opacity-0');
                    }
                }
            }

            // Memulai efek mengetik
            typeWriter();
        });
    </script>
</body>
</html>
