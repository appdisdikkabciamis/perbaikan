<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tahap Perancangan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            /* Mengubah warna background hitam menjadi biru muda yang mirip dengan gambar 
               agar garis tepi tidak terlihat aneh saat menggunakan mode 'contain' */
            background-color: #76c2eb; 
        }
        .bg-container {
            position: relative;
            width: 100%;
            height: 100%;
            /* Menggunakan gambar sebagai background CSS, bukan tag <img> */
            background-image: url('bg.jpg');
            
            /* Menggunakan 'cover' agar gambar tetap proporsional dan tidak bantet 
               di layar dengan rasio berbeda (seperti iPad/Tablet).
               Posisi difokuskan ke kanan agar tas selalu terlihat. */
            background-size: cover;
            background-repeat: no-repeat;
            background-position: right center;
        }
        .text-overlay {
            position: absolute;
            top: 50%;
            left: 10%;
            transform: translateY(-50%);
            max-width: 90%;
            /* Warna teks diubah ke hitam sesuai gambar referensi */
            color: #000000; 
            /* Memberikan sedikit efek outline/bayangan terang agar teks tetap tajam */
            text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
            animation: fadeIn 1s ease-out forwards;
        }
        .text-overlay h1 {
            /* Ukuran disesuaikan agar proporsional dengan gambar seperti di referensi */
            font-size: 4vw; 
            font-weight: 800;
            line-height: 1.3;
            margin: 0;
            letter-spacing: -1px;
            /* Penting: membuat \n di Javascript menjadi baris baru */
            white-space: pre-wrap; 
        }
        
        /* Efek kursor berkedip untuk animasi mengetik */
        .text-overlay h1::after {
            content: '|';
            font-weight: 400;
            animation: blink 1s step-end infinite;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-40%);
            }
            to {
                opacity: 1;
                transform: translateY(-50%);
            }
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
        
        /* Responsif untuk tampilan di HP dan Tablet Portrait */
        @media (max-width: 1024px) and (orientation: portrait), (max-width: 768px) {
            .bg-container {
                /* Menambahkan efek gradient untuk membaurkan (blend) pinggiran atas gambar 
                   tas dengan warna biru background, sehingga terlihat menyatu sempurna */
                background-image: 
                    linear-gradient(to bottom, #76c2eb 34%, transparent 45%),
                    url('bg.jpg');
                background-size: 100% 100%, auto 65%;
                /* Menggeser tas sedikit ke kiri dari 80% ke 87% agar benar-benar pas di tengah */
                background-position: center top, 87% bottom;
                background-repeat: no-repeat, no-repeat;
            }
            .text-overlay {
                /* Teks diturunkan sedikit agar tidak terlalu mepet atas layar */
                top: 20%;
                left: 8%;
                max-width: 85%;
            }
            .text-overlay h1 {
                font-size: 8vw; /* Sedikit dikecilkan agar pas */
            }
        }
    </style>
</head>
<body>
    <div class="bg-container">
        <div class="text-overlay">
            <h1 id="typewriter"></h1>
        </div>
    </div>

    <script>
        // Menggunakan \n untuk membuat baris baru persis seperti di gambar
        const text = "Portal layanan\nini sedang\ndalam tahap\nperancangan ...";
        const element = document.getElementById("typewriter");
        let i = 0;
        
        function typeWriter() {
            if (i < text.length) {
                element.innerHTML += text.charAt(i);
                i++;
                // Kecepatan ketik
                let speed = Math.random() * (100 - 40) + 40; 
                setTimeout(typeWriter, speed);
            }
        }
        
        window.onload = function() {
            setTimeout(typeWriter, 500);
        };
    </script>
</body>
</html>
